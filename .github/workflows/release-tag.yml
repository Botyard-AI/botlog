name: release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit stable semver version, without the leading v. Leave blank to auto-bump."
        required: false
        type: string
      bump:
        description: "Version bump to apply when version is blank"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      message:
        description: "Optional annotated tag message"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release request
        id: release
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release tags must be created from refs/heads/main; got ${GITHUB_REF}" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          npm_version="$(npm view botlog version 2>/dev/null || true)"

          VERSION_INPUT="${{ inputs.version }}" \
          BUMP="${{ inputs.bump }}" \
          PACKAGE_VERSION="${package_version}" \
          NPM_VERSION="${npm_version}" \
          node --input-type=module <<'NODE' > /tmp/release-version.env
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const versionInput = (process.env.VERSION_INPUT ?? "").trim();
          const bump = process.env.BUMP ?? "patch";
          const packageVersion = process.env.PACKAGE_VERSION ?? "0.0.0";
          const npmVersion = (process.env.NPM_VERSION ?? "").trim();
          const baseVersion = npmVersion || packageVersion;

          const parse = (version) => {
            if (!semver.test(version)) {
              throw new Error(`Expected stable semver like 0.1.0; got ${version}`);
            }
            return version.split(".").map((part) => Number.parseInt(part, 10));
          };

          const compare = (a, b) => {
            for (let index = 0; index < 3; index += 1) {
              if (a[index] !== b[index]) {
                return a[index] > b[index] ? 1 : -1;
              }
            }
            return 0;
          };

          const format = ([major, minor, patch]) => `${major}.${minor}.${patch}`;

          const latest = parse(baseVersion);
          let version;

          if (versionInput) {
            version = parse(versionInput);
          } else {
            if (!["patch", "minor", "major"].includes(bump)) {
              throw new Error(`Bump must be patch, minor, or major; got ${bump}`);
            }

            version = [...latest];
            if (bump === "patch") {
              version[2] += 1;
            } else if (bump === "minor") {
              version[1] += 1;
              version[2] = 0;
            } else {
              version[0] += 1;
              version[1] = 0;
              version[2] = 0;
            }
          }

          if (compare(version, latest) <= 0) {
            throw new Error(`Release version ${format(version)} must be greater than latest known version ${baseVersion}`);
          }

          console.log(`version=${format(version)}`);
          console.log(`base_version=${baseVersion}`);
          console.log(`resolution=${versionInput ? "explicit" : `auto-${bump}`}`);
          NODE

          cat /tmp/release-version.env >> "${GITHUB_OUTPUT}"
          # shellcheck disable=SC1091
          source /tmp/release-version.env

          tag="v${version}"
          if npm view "botlog@${version}" version >/dev/null 2>&1; then
            echo "botlog@${version} is already published on npm" >&2
            exit 1
          fi

          tag_sha=""
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
            peeled_sha="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}' || true)"
            if [ -n "${peeled_sha}" ]; then
              tag_sha="${peeled_sha}"
            fi
            if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${tag} already exists at ${tag_sha}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "Tag ${tag} already exists at this commit; continuing so a failed publish can be retried."
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${tag} from ${resolution} against base ${base_version}."

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Set package version from resolved release
        run: npm pkg set "version=${{ steps.release.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release candidate
        run: |
          pnpm ci
          pnpm pack:dry-run

      - name: Create and push release tag
        if: steps.release.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag_message="${MESSAGE:-Botlog v${VERSION}}"
          git tag -a "${TAG}" -m "${tag_message}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "Created ${TAG}."

      - name: Publish to npm
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
