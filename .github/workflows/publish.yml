name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify publish ref
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="refs/tags/v${version}"

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
                echo "Manual publishes must run from refs/heads/main; got ${GITHUB_REF}" >&2
                exit 1
              fi
              ;;
            release)
              if [ "${GITHUB_REF}" != "${expected_tag}" ]; then
                echo "Release tag must match package.json version: expected ${expected_tag}, got ${GITHUB_REF}" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported publish event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm ci

      - name: Publish to npm
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
